<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @page { size: 54mm 86mm; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .card { width: 54mm; height: 86mm; border: 0.4mm solid #111; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .head { width: 100%; background: #111; color: #fff; padding: 2.5mm 2mm; font-size: 7pt; font-weight: bold; letter-spacing: .3px; }
  .head small { display: block; font-weight: normal; font-size: 5.5pt; opacity: .8; margin-top: .5mm; }
  .photo { width: 22mm; height: 26mm; margin-top: 3mm; border: 0.3mm solid #999; background: #eee; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { font-size: 9pt; font-weight: bold; margin-top: 2mm; padding: 0 2mm; }
  .role { font-size: 6.5pt; color: #444; margin-top: .5mm; }
  .rows { margin-top: 2mm; font-size: 6pt; width: 100%; padding: 0 3mm; text-align: left; line-height: 1.6; }
  .rows b { display: inline-block; width: 15mm; font-weight: normal; color: #666; }
  .foot { margin-top: auto; width: 100%; border-top: 0.3mm solid #111; padding: 1.5mm; font-size: 5.5pt; color: #444; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">CUTM AWARDING BODY<small>Assessor Identity Card</small></div>
    <div class="photo">{{#photo}}<img src="{{photo}}" alt="" />{{/photo}}</div>
    <div class="name">{{name}}</div>
    <div class="role">Assessor · {{assessorCode}}</div>
    <div class="rows">
      <div><b>Mobile</b> {{mobile}}</div>
      <div><b>Qualification</b> {{qualification}}</div>
      <div><b>Sectors</b> {{sectors}}</div>
      <div><b>Blood group</b> {{bloodGroup}}</div>
      <div><b>Valid till</b> {{validTill}}</div>
    </div>
    <div class="foot">Issued {{issueDate}} · If found, return to CUTM, Bhubaneswar</div>
  </div>
</body>
</html>
